<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer-when-downgrade" />
    <!-- SECURITY: Content Security Policy -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' schoolhelper: file:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https: blob:; connect-src 'self' https://school-helper.ru https://openrouter.ai https://www.googleapis.com https://accounts.google.com;">
    <title>School Helper Бета 0.1.2</title>
    <!-- Anti-flicker theme script -->
    <script>
        (function() {
            try {
                const config = JSON.parse(localStorage.getItem('school_helper_config') || '{}');
                const isDark = config.themeMode !== 'light';
                document.documentElement.style.backgroundColor = isDark ? '#202225' : '#f8f9fa';
                if (isDark) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            } catch (e) {}
        })();
    </script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            user-select: text; 
            -webkit-user-select: text;
            transition: background-color 0.3s ease;
        }
        
        input, textarea, [contenteditable] {
            user-select: text !important;
            -webkit-user-select: text !important;
            cursor: text;
        }

        button, .no-select {
            user-select: none;
            -webkit-user-select: none;
        }
        
        .prose {
            max-width: none !important;
        }

        /* Placeholder for contenteditable */
        [contenteditable]:empty:before {
            content: attr(data-placeholder);
            color: #8e9297;
            opacity: 0.5;
            pointer-events: none;
            display: block;
        }

        /* Modern Scrollbar */
        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background-color: rgba(156, 163, 175, 0.3);
            border-radius: 5px;
            border: 2px solid transparent;
            background-clip: content-box;
            transition: background-color 0.2s;
        }
        ::-webkit-scrollbar-thumb:hover {
            background-color: rgba(156, 163, 175, 0.5);
        }

        /* --- CUSTOM ANIMATIONS --- */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideInFromBottom { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes slideInFromRight { from { transform: translateX(20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes slideInFromLeft { from { transform: translateX(-20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes zoomIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .animate-in { animation-fill-mode: forwards; animation-duration: 0.3s; }
        .fade-in { animation-name: fadeIn; }
        .slide-in-from-bottom-2 { animation-name: slideInFromBottom; animation-duration: 0.4s; }
        .slide-in-from-bottom-4 { animation-name: slideInFromBottom; animation-duration: 0.5s; }
        .slide-in-from-right-10 { animation-name: slideInFromRight; animation-duration: 0.5s; }
        .slide-in-from-left-5 { animation-name: slideInFromLeft; animation-duration: 0.4s; }
        .zoom-in-95 { animation-name: zoomIn; animation-duration: 0.2s; }
        
        .cursor-wait { cursor: wait; }

        #root {
            width: 100%;
            height: 100%;
            display: flex;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>

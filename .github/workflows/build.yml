
name: Build Desktop App

on:
  push:
    branches:
      - main
      - PC
  pull_request:
    branches:
      - main
      - PC
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0 libnotify4 libnss3 libxss1 libxtst6 xdg-utils libatspi2.0-0 libdrm2 libgbm1 libasound2t64 ruby ruby-dev rubygems build-essential
          sudo gem install fpm

      - name: Install Project Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build
        env:
          VITE_OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          VITE_API_KEY: ${{ secrets.API_KEY }}

      - name: Build Electron App (AppImage, deb, tar.gz)
        run: npm run build:linux
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USE_SYSTEM_FPM: "true"
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: school-helper-linux
          path: |
            dist_electron/*.AppImage
            dist_electron/*.deb
            dist_electron/*.tar.gz

  build-win:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Project Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build
        env:
          VITE_OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          VITE_API_KEY: ${{ secrets.API_KEY }}

      - name: Build Electron App (exe - nsis and portable)
        run: npx electron-builder --win nsis portable
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: school-helper-windows
          path: |
            dist_electron/*.exe

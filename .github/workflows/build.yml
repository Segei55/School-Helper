
name: Build Desktop App

on:
  push:
    branches:
      - main
      - PC
  pull_request:
    branches:
      - main
      - PC
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev rubygems build-essential libarchive-tools
          sudo gem install --no-document fpm

      - name: Install Project Dependencies
        run: npm install --no-package-lock --force

      - name: Inject Secrets into Main Process (Linux)
        run: |
          node -e "const fs = require('fs'); const path = 'electron/main.js'; let content = fs.readFileSync(path, 'utf8'); content = content.replace('REPLACE_ME_IN_CI', process.env.OPENROUTER_API_KEY || 'REPLACE_ME_IN_CI'); fs.writeFileSync(path, content);"
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Build Web Application
        run: npm run build
        env:
          API_KEY: ${{ secrets.API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Build Electron App (Linux)
        run: npx electron-builder --linux AppImage deb tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USE_SYSTEM_FPM: true

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: school-helper-linux
          path: |
            dist_electron/*.deb
            dist_electron/*.tar.gz
            dist_electron/*.AppImage

  build-win:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Project Dependencies
        run: npm install --no-package-lock --force

      - name: Inject Secrets into Main Process (Windows)
        run: |
          node -e "const fs = require('fs'); const path = 'electron/main.js'; let content = fs.readFileSync(path, 'utf8'); content = content.replace('REPLACE_ME_IN_CI', process.env.OPENROUTER_API_KEY || 'REPLACE_ME_IN_CI'); fs.writeFileSync(path, content);"
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Build Web Application
        run: npm run build
        env:
          API_KEY: ${{ secrets.API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Build Electron App (exe)
        run: npx electron-builder --win nsis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: school-helper-windows
          path: dist_electron/*.exe

name: Build Desktop App

on:
  push:
    branches:
      - main
      - PC
  pull_request:
    branches:
      - main
      - PC
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Project Dependencies
        run: npm install

      - name: Inject Secrets into Main Process (Linux)
        run: |
          if [ -n "$OPENROUTER_API_KEY" ]; then
            sed -i "s/REPLACE_ME_IN_CI/$OPENROUTER_API_KEY/g" electron/main.js
          fi
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Build Web Application
        run: npm run build

      - name: Build Electron App (Linux)
        run: npx electron-builder --linux AppImage deb tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: school-helper-linux
          path: |
            dist_electron/*.deb
            dist_electron/*.tar.gz
            dist_electron/*.AppImage

  build-win:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Project Dependencies
        run: npm install

      - name: Inject Secrets into Main Process (Windows)
        run: |
          if ($env:OPENROUTER_API_KEY) {
            (Get-Content electron/main.js) -replace 'REPLACE_ME_IN_CI', $env:OPENROUTER_API_KEY | Set-Content electron/main.js
          }
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Build Web Application
        run: npm run build

      - name: Build Electron App (exe)
        run: npx electron-builder --win nsis portable
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: school-helper-windows
          path: |
            dist_electron/*.exe
            dist_electron/*.exe

  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Project Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: school-helper-android
          path: android/app/build/outputs/apk/debug/app-debug.apk

  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Project Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: school-helper-web
          path: dist/